[settings]
npm.package_manager = "auto"

[tools]
"go:github.com/irskep/autowt" = "latest"
node = "lts"
'npm:@earendil-works/pi-coding-agent' = 'latest'
'npm:@github/copilot' = 'latest'
'npm:@googleworkspace/cli' = { version = 'latest', allow_builds = ['@googleworkspace/cli'] }
'npm:@openai/codex' = 'latest'
'npm:ccusage' = 'latest'
'npm:claudefm' = { version = 'latest', allow_low_downloads = true }
'npm:fieldtheory' = { version = 'latest', allow_low_downloads = true }
'npm:git-trim' = { version = 'latest', allow_low_downloads = true }
'npm:gnomon' = 'latest'
'npm:npm-check-updates' = 'latest'
'npm:opencode-ai' = { version = 'latest', allow_builds = ['opencode-ai'] }
'npm:oxfmt' = 'latest'
'npm:oxlint' = 'latest'
'npm:socket.io-cli' = { version = 'latest', allow_low_downloads = true }
'npm:wscat' = 'latest'
'npm:pnpm' = '12'
